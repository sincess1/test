name: Deploy Yangyang Live

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          base64 --decode site/index.html.gz.b64 | gzip --decompress > _site/index.html
          base64 --decode site/apple-touch-icon.png.b64 > _site/apple-touch-icon.png
          cp site/manifest.webmanifest site/sw.js site/icon.svg _site/
          test -s _site/index.html
          test -s _site/apple-touch-icon.png
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
