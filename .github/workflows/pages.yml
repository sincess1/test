name: Deploy Yangyang Live

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          base64 --decode site-v8/site.tgz.b64 > /tmp/yangyang-live-v8.tgz
          echo "fa3eba1ee5415738421c4cc77f6201e951299cf7aae38c75b0c2fe282a28ac4a  /tmp/yangyang-live-v8.tgz" | sha256sum -c -
          tar -xzf /tmp/yangyang-live-v8.tgz -C _site
          base64 --decode site/apple-touch-icon.png.b64 > _site/apple-touch-icon.png
          touch _site/.nojekyll

          test -s _site/index.html
          test -s _site/manifest.webmanifest
          test -s _site/sw.js
          test -s _site/icon.svg
          test -s _site/apple-touch-icon.png
          grep -q 'id="arriveTop"' _site/index.html
          grep -q 'id="departTop"' _site/index.html
          grep -q 'id="editTop"' _site/index.html
          grep -q 'Asia/Seoul' _site/index.html
          grep -q '만석닭강정 시장1호점' _site/index.html
          grep -q '갯배선착장' _site/index.html

      - name: Publish verified files to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
          enable_jekyll: false
          full_commit_message: Publish Yangyang Live v8

      - name: Configure Pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
