name: Deploy Yangyang Live

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and verify static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/full
          cat site/full/part-*.txt > /tmp/index.full.html.gz.b64
          base64 --decode /tmp/index.full.html.gz.b64 | gzip --decompress > /tmp/index.full.html
          echo "6b1c0e3edd47e3936fdf496048bdda37ca9ffdb636c71ff9b0f3778fa8430010  /tmp/index.full.html" | sha256sum -c -
          cp /tmp/index.full.html _site/index.html
          sed -i 's|<link href="./icon.svg" rel="apple-touch-icon"/>|<link href="./apple-touch-icon.png" rel="apple-touch-icon"/>|' _site/index.html
          base64 --decode site/apple-touch-icon.png.b64 > _site/apple-touch-icon.png
          cp site/full/part-*.txt _site/full/
          cp site/manifest.webmanifest site/sw.js site/icon.svg _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/apple-touch-icon.png
          grep -q 'id="arriveNowBtn"' _site/index.html
          grep -q 'id="leaveNowBtn"' _site/index.html
          grep -q 'id="editTimeBtn"' _site/index.html
          grep -q 'Asia/Seoul' _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
